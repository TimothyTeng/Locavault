version: 2
updates:
  # npm dependencies — weekly, grouped so minor/patch bumps arrive as one PR
  # (lower noise for a solo maintainer) while majors come through individually.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  # Keep GitHub Actions pinned versions fresh (supply-chain hygiene).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
