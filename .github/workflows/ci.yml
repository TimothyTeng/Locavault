name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        # Build doesn't hit the DB, but Vite inlines VITE_* vars — give it
        # placeholders so nothing reads `undefined` at build time.
        env:
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_ci_placeholder
          CLERK_SECRET_KEY: sk_test_ci_placeholder
          TURSO_DATABASE_URL: libsql://ci-placeholder.turso.io
          TURSO_AUTH_TOKEN: ci-placeholder
